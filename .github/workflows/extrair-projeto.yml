name: Organizar projeto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          rm -rf /tmp/ponto
          mkdir -p /tmp/ponto
          unzip -q -o PontoDoLanche-Online-Render-PostgreSQL.zip -d /tmp/ponto
          cp -R /tmp/ponto/PontoDoLanche/. .

      - name: Remover arquivos temporarios
        run: |
          rm -rf /tmp/ponto
          rm -f PontoDoLanche-Online-Render-PostgreSQL.zip

      - name: Preparar Git
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

      - name: Salvar alteracoes
        run: |
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
          else
            git commit -m "Organizar projeto para hospedagem"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
