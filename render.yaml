services:
  - type: web
    name: ponto-do-lanche
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ponto-do-lanche-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: ponto-do-lanche-db
    plan: free
    databaseName: ponto_do_lanche
    user: ponto_lanche
