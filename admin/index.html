<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2d2f30"><title>Ponto do Lanche — Loja</title><style>
:root{--dark:#2d2f30;--dark2:#202223;--cream:#f6f0e5;--orange:#c96b2d;--beige:#d5b987;--muted:#aaa297;--line:#ffffff16}*{box-sizing:border-box}body{margin:0;background:#161718;color:#f5efe4;font-family:Inter,Arial}.wrap{width:min(1250px,94%);margin:auto}.login{min-height:100vh;display:grid;place-items:center}.card{background:#202223;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 20px 60px #0007}.login .card{width:min(420px,92%)}h1,h2,h3{font-family:Georgia}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:800}.field input,.field textarea,.field select{width:100%;background:#151617;color:white;border:1px solid var(--line);border-radius:10px;padding:11px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:900;cursor:pointer}.primary{background:var(--orange);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{background:#202223;border:1px solid var(--line);border-radius:18px;padding:18px}.metric small{color:var(--muted)}.metric b{display:block;font-size:28px;margin-top:8px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0}.nav button{background:#252728;color:white;border:1px solid var(--line);border-radius:9px;padding:10px 13px;font-weight:800}.nav button.active{background:var(--orange)}.section{display:none}.section.active{display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.pill{padding:5px 8px;border-radius:99px;background:#3a3d3e}.order{background:#202223;border:1px solid var(--line);border-radius:16px;padding:15px;margin:10px 0}.orderhead{display:flex;justify-content:space-between;gap:10px}.status{padding:7px;border-radius:8px;background:#303334;color:white}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.danger{background:#713232;color:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.low{color:#ff9d6b;font-weight:900}.toast{position:fixed;right:15px;bottom:15px;background:var(--orange);padding:14px 18px;border-radius:12px;display:none}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 0}.top small{color:var(--beige)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.two{grid-template-columns:1fr}.table{display:block;overflow:auto;white-space:nowrap}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="app"></div><div class="toast" id="toast"></div>
<script src="/socket.io/socket.io.js"></script><script>
const $=id=>document.getElementById(id);let current="dashboard";
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});if(r.status===401){showLogin();throw 0}const d=await r.json();if(!r.ok)throw Error(d.error||"Erro");return d}
function showLogin(){$("app").innerHTML=`<div class="login"><div class="card"><div style="color:var(--beige);font-weight:900">PONTO DO LANCHE</div><h1>Entrar na loja</h1><div class="field"><label>Usuário</label><input id="u" value="admin"></div><div class="field"><label>Senha</label><input id="p" type="password" placeholder="Senha do painel"></div><button class="btn primary" style="width:100%" onclick="login()">Entrar</button><p style="color:var(--muted);font-size:12px">A senha inicial vem do servidor. Troque no .env antes de colocar online.</p></div></div>`}
async function login(){try{await api("/api/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});boot()}catch(e){alert(e.message)}}
async function boot(){try{await api("/api/me");renderShell();loadSection()}catch(e){showLogin()}}
function renderShell(){$("app").innerHTML=`<div class="wrap"><div class="top"><div><small>LOJA / ADMINISTRAÇÃO</small><h1 style="margin:5px 0">Ponto do Lanche</h1></div><button class="btn" onclick="logout()">Sair</button></div><div class="nav">${["dashboard","pedidos","cardapio","caixa","estoque","caderno","organizacao","config"].map(x=>`<button class="${x===current?"active":""}" onclick="go('${x}')">${({dashboard:"Dashboard",pedidos:"Pedidos",cardapio:"Cardápio",caixa:"Caixa",estoque:"Estoque",caderno:"Caderno",organizacao:"Organização",config:"Configurações"})[x]}</button>`).join("")}</div><div id="content"></div></div>`}
function go(x){current=x;renderShell();loadSection()}
async function loadSection(){try{if(current==="dashboard")return dashboard();if(current==="pedidos")return orders();if(current==="cardapio")return menu();if(current==="caixa")return cash();if(current==="estoque")return inventory();if(current==="caderno")return notes();if(current==="organizacao")return tasks();if(current==="config")return config()}catch(e){$("content").innerHTML=`<div class="card">${e.message}</div>`}}
async function dashboard(){const d=await api("/api/admin/dashboard");$("content").innerHTML=`<div class="grid"><div class="metric"><small>Vendas hoje</small><b>${brl(d.sales)}</b></div><div class="metric"><small>Pedidos hoje</small><b>${d.orders}</b></div><div class="metric"><small>Pendentes</small><b>${d.pending}</b></div><div class="metric"><small>Saldo de caixa</small><b>${brl(d.balance)}</b></div></div><div class="two" style="margin-top:15px"><div class="card"><h2>Resumo do caixa</h2><p>Entradas: <b>${brl(d.cashIn)}</b></p><p>Saídas: <b>${brl(d.cashOut)}</b></p><p>Resultado: <b>${brl(d.balance)}</b></p></div><div class="card"><h2>Mais vendidos</h2>${d.top.map(x=>`<p>${x.name} <b style="float:right">${x.qty}</b></p>`).join("")||"<p>Sem vendas ainda.</p>"}</div></div>`}
async function orders(){const list=await api("/api/admin/orders");$("content").innerHTML=`<div class="card"><h2>Pedidos recebidos</h2>${list.map(o=>`<div class="order"><div class="orderhead"><div><b>${o.number}</b> · ${o.name}<br><small>${o.phone} · ${o.service}${o.table_no?" · Mesa "+o.table_no:""}</small></div><strong>${brl(o.total)}</strong></div><p>Pagamento: ${o.payment}${o.change_for?` · Troco para ${brl(o.change_for)}`:""}</p><select class="status" onchange="setStatus(${o.id},this.value)">${["Novo","Confirmado","Em preparo","Pronto","Entregue","Cancelado"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select><div class="actions"><button class="btn" onclick="call('${o.phone}')">📞 Ligar</button><button class="btn" onclick="zap('${o.phone}')">WhatsApp</button></div></div>`).join("")||"<p>Nenhum pedido.</p>"}</div>`}
async function setStatus(id,status){await api("/api/admin/orders/"+id,{method:"PATCH",body:JSON.stringify({status})});toast("Status atualizado");orders()}
async function menu(){const [ps,cs]=await Promise.all([api("/api/admin/products"),api("/api/categories")]);$("content").innerHTML=`<div class="card"><h2>Cardápio</h2><div class="actions"><button class="btn primary" onclick="newProduct()">+ Produto</button><button class="btn" onclick="newCategory()">+ Categoria</button></div><table class="table"><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Disponível</th><th></th></tr>${ps.map(p=>`<tr><td>${p.name}</td><td>${p.category||"-"}</td><td>${brl(p.price)}</td><td>${p.stock?"Sim":"Não"}</td><td><button class="btn" onclick='editProduct(${JSON.stringify(p)})'>Editar</button> <button class="btn danger" onclick="delProduct(${p.id})">Excluir</button></td></tr>`).join("")}</table></div>`}
async function newProduct(){const name=prompt("Nome do produto");if(!name)return;const price=prompt("Preço");const cs=await api("/api/categories");const cat=prompt("ID da categoria: "+cs.map(x=>x.id+"="+x.name).join(", "),cs[0]?.id);await api("/api/admin/products",{method:"POST",body:JSON.stringify({name,price,category_id:cat})});menu()}
async function editProduct(p){const name=prompt("Nome",p.name);if(name===null)return;const price=prompt("Preço",p.price);await api("/api/admin/products/"+p.id,{method:"PUT",body:JSON.stringify({...p,name,price})});menu()}
async function delProduct(id){if(confirm("Excluir produto?")){await api("/api/admin/products/"+id,{method:"DELETE"});menu()}}
async function newCategory(){const name=prompt("Nome da categoria");if(name){await api("/api/admin/categories",{method:"POST",body:JSON.stringify({name})});menu()}}
async function cash(){const rows=await api("/api/admin/cash");$("content").innerHTML=`<div class="card"><h2>Fluxo de caixa</h2><button class="btn primary" onclick="newCash()">+ Lançamento</button><table class="table"><tr><th>Tipo</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th>Pagamento</th><th></th></tr>${rows.map(x=>`<tr><td>${x.type}</td><td>${x.description}</td><td>${x.category}</td><td>${brl(x.value)}</td><td>${x.payment}</td><td><button class="btn danger" onclick="delCash(${x.id})">Excluir</button></td></tr>`).join("")}</table></div>`}
async function newCash(){const type=prompt("entrada ou saida","entrada");if(!type)return;const description=prompt("Descrição");const value=prompt("Valor");await api("/api/admin/cash",{method:"POST",body:JSON.stringify({type,description,value,category:"Outros",payment:"dinheiro"})});cash()}
async function delCash(id){await api("/api/admin/cash/"+id,{method:"DELETE"});cash()}
async function inventory(){const rows=await api("/api/admin/inventory");$("content").innerHTML=`<div class="card"><h2>Estoque</h2><button class="btn primary" onclick="newInv()">+ Item</button><table class="table"><tr><th>Item</th><th>Tipo</th><th>Qtd.</th><th>Mínimo</th><th>Un.</th><th>Custo</th><th>Fornecedor</th><th></th></tr>${rows.map(x=>`<tr><td>${x.name}</td><td>${x.kind}</td><td class="${x.qty<=x.min_qty?"low":""}">${x.qty}</td><td>${x.min_qty}</td><td>${x.unit}</td><td>${brl(x.cost)}</td><td>${x.supplier}</td><td><button class="btn danger" onclick="delInv(${x.id})">Excluir</button></td></tr>`).join("")}</table></div>`}
async function newInv(){const name=prompt("Item");if(!name)return;const qty=prompt("Quantidade","0"),min_qty=prompt("Estoque mínimo","0");await api("/api/admin/inventory",{method:"POST",body:JSON.stringify({name,qty,min_qty,kind:"Outros",unit:"un"})});inventory()}
async function delInv(id){await api("/api/admin/inventory/"+id,{method:"DELETE"});inventory()}
async function notes(){const rows=await api("/api/admin/notes");$("content").innerHTML=`<div class="card"><h2>Meu Caderno</h2><button class="btn primary" onclick="newNote()">+ Anotação</button>${rows.map(x=>`<div class="order"><b>${x.pinned?"📌 ":""}${x.title}</b><p>${x.body||""}</p><small>${x.category}</small><button class="btn danger" style="float:right" onclick="delNote(${x.id})">Excluir</button></div>`).join("")}</div>`}
async function newNote(){const title=prompt("Título");if(!title)return;const body=prompt("Anotação");await api("/api/admin/notes",{method:"POST",body:JSON.stringify({title,body})});notes()}
async function delNote(id){await api("/api/admin/notes/"+id,{method:"DELETE"});notes()}
async function tasks(){const rows=await api("/api/admin/tasks");$("content").innerHTML=`<div class="card"><h2>Organização</h2><button class="btn primary" onclick="newTask()">+ Tarefa</button>${rows.map(x=>`<p><input type="checkbox" ${x.done?"checked":""} onchange="toggleTask(${x.id},this.checked)"> ${x.title} ${x.due?"· "+x.due:""} <button class="btn danger" style="float:right" onclick="delTask(${x.id})">×</button></p>`).join("")}</div>`}
async function newTask(){const title=prompt("Tarefa");if(title){await api("/api/admin/tasks",{method:"POST",body:JSON.stringify({title})});tasks()}}
async function toggleTask(id,done){await api("/api/admin/tasks/"+id,{method:"PATCH",body:JSON.stringify({done})});tasks()}
async function delTask(id){await api("/api/admin/tasks/"+id,{method:"DELETE"});tasks()}
async function config(){const s=await api("/api/admin/settings");$("content").innerHTML=`<div class="card"><h2>Configurações da loja</h2><div class="field"><label>Nome</label><input id="sn" value="${s.name||"Ponto do Lanche"}"></div><div class="field"><label>WhatsApp</label><input id="sw" value="${s.whatsapp||""}"></div><div class="field"><label>Horário</label><input id="sh" value="${s.hours||"06:30 – 17:00"}"></div><div class="field"><label>Endereço</label><textarea id="sa">${s.address||"BR-020"}</textarea></div><button class="btn primary" onclick="saveConfig()">Salvar</button></div>`}
async function saveConfig(){await api("/api/admin/settings",{method:"PUT",body:JSON.stringify({name:sn.value,whatsapp:sw.value,hours:sh.value,address:sa.value})});toast("Configurações salvas")}
function brl(v){return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v)}
function call(p){location.href="tel:"+String(p).replace(/\D/g,"")}
function zap(p){window.open("https://wa.me/55"+String(p).replace(/\D/g,""),"_blank")}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2200)}
async function logout(){await api("/api/logout",{method:"POST"});showLogin()}
const socket=io();socket.on("order:new",o=>{toast("🔔 Novo pedido "+o.number);if(current==="pedidos")orders();else if(current==="dashboard")dashboard();if(navigator.vibrate)navigator.vibrate([200,100,200])});socket.on("order:status",()=>{});
boot();
</script></body></html>
